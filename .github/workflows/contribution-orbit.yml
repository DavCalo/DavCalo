name: Generate contribution scan

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_contribution_scan.py"
      - ".github/workflows/contribution-scan.yml"

permissions:
  contents: write

concurrency:
  group: contribution-scan
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate animated contribution scan
        run: python scripts/generate_contribution_scan.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVG files to output branch
        run: |
          set -euo pipefail

          mkdir -p /tmp/contribution-scan
          cp dist/contribution-scan*.svg /tmp/contribution-scan/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan contribution-scan-output
          git rm -rf . || true
          cp /tmp/contribution-scan/*.svg .
          touch .nojekyll

          git add .
          git commit -m "chore: update contribution scan"
          git push --force origin HEAD:output
