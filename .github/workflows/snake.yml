name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/satellite-contribution-trail.svg?palette=github-light&color_snake=#0EA5E9&color_dots=#EBEDF0,#CFFAFE,#67E8F9,#38BDF8,#0EA5E9
            dist/satellite-contribution-trail-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0D1117,#1E293B,#155E75,#0891B2,#67E8F9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
