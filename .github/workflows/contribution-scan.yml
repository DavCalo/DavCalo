name: Generate contribution constellation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_contribution_scan.py"
      - "assets/profile-hero-*.svg"
      - "assets/orbitops-feature-*.svg"
      - "assets/engineering-stack-*.svg"
      - ".github/workflows/contribution-scan.yml"

permissions:
  contents: read

concurrency:
  group: contribution-constellation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Generate and validate profile visuals
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Generate contribution constellation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/profile-generated"
          python3 -m py_compile scripts/generate_contribution_scan.py
          python3 scripts/generate_contribution_scan.py \
            --output "$RUNNER_TEMP/profile-generated"
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SVG assets
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          generated = Path(os.environ["RUNNER_TEMP"]) / "profile-generated"
          generated_files = {
              "contribution-scan.svg": generated / "contribution-scan.svg",
              "contribution-scan-dark.svg": generated / "contribution-scan-dark.svg",
          }
          static_files = {
              "profile-hero-light.svg": Path("assets/profile-hero-light.svg"),
              "profile-hero-dark.svg": Path("assets/profile-hero-dark.svg"),
              "orbitops-feature-light.svg": Path("assets/orbitops-feature-light.svg"),
              "orbitops-feature-dark.svg": Path("assets/orbitops-feature-dark.svg"),
              "engineering-stack-light.svg": Path("assets/engineering-stack-light.svg"),
              "engineering-stack-dark.svg": Path("assets/engineering-stack-dark.svg"),
          }
          files = {**generated_files, **static_files}

          actual_generated = {path.name for path in generated.iterdir()}
          if actual_generated != set(generated_files):
              raise SystemExit(
                  f"generated directory must contain exactly {sorted(generated_files)}, "
                  f"got {sorted(actual_generated)}"
              )

          def local_name(name: str) -> str:
              return name.rsplit("}", 1)[-1].lower()

          signatures: dict[str, tuple[str | None, str | None, str | None]] = {}

          for name, path in files.items():
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"{name} is missing or empty")
              if path.stat().st_size > 500_000:
                  raise SystemExit(f"{name} is unexpectedly large")

              raw = path.read_text(encoding="utf-8")
              try:
                  root = ET.fromstring(raw)
              except ET.ParseError as exc:
                  raise SystemExit(f"{name} is not valid XML: {exc}") from exc

              if local_name(root.tag) != "svg":
                  raise SystemExit(f"{name} root element is not svg")
              if root.attrib.get("role") != "img":
                  raise SystemExit(f"{name} must declare role=img")

              elements = list(root.iter())
              counts = Counter(local_name(element.tag) for element in elements)
              if counts["title"] != 1 or counts["desc"] != 1:
                  raise SystemExit(f"{name} must contain exactly one title and one desc")
              if counts["script"] or counts["foreignobject"]:
                  raise SystemExit(f"{name} contains a forbidden element")

              ids: set[str] = set()
              for element in elements:
                  identifier = element.attrib.get("id")
                  if identifier:
                      if identifier in ids:
                          raise SystemExit(f"{name} contains duplicate id {identifier}")
                      ids.add(identifier)
                  for attribute, value in element.attrib.items():
                      attribute_name = local_name(attribute)
                      if attribute_name.startswith("on"):
                          raise SystemExit(f"{name} contains an event handler")
                      if attribute_name.endswith("href") or attribute_name == "src":
                          raise SystemExit(f"{name} contains a linked resource")
                      if "javascript:" in value.lower() or "data:" in value.lower():
                          raise SystemExit(f"{name} contains a forbidden resource")

              style = "\n".join(
                  element.text or ""
                  for element in elements
                  if local_name(element.tag) == "style"
              )
              if "@keyframes" not in style:
                  raise SystemExit(f"{name} is missing animation keyframes")
              if (
                  "prefers-reduced-motion: reduce" not in style
                  and "prefers-reduced-motion:reduce" not in style
              ):
                  raise SystemExit(f"{name} is missing reduced-motion handling")

              signatures[name] = (
                  root.attrib.get("width"),
                  root.attrib.get("height"),
                  root.attrib.get("viewBox"),
              )
              print(f"Validated {name} ({path.stat().st_size} bytes)")

          pairs = [
              ("profile-hero-light.svg", "profile-hero-dark.svg"),
              ("orbitops-feature-light.svg", "orbitops-feature-dark.svg"),
              ("engineering-stack-light.svg", "engineering-stack-dark.svg"),
              ("contribution-scan.svg", "contribution-scan-dark.svg"),
          ]
          for light, dark in pairs:
              if signatures[light] != signatures[dark]:
                  raise SystemExit(f"{light} and {dark} use different canvas geometry")
              print(f"Validated matching geometry: {light} / {dark}")
          PY

      - name: Upload validated contribution constellation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contribution-constellation
          path: ${{ runner.temp }}/profile-generated/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish contribution constellation
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Download validated SVG artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contribution-constellation
          path: ${{ runner.temp }}/profile-generated

      - name: Publish SVG files to output branch
        shell: bash
        run: |
          GENERATED_DIR="$RUNNER_TEMP/profile-generated"
          PUBLISH_DIR="$RUNNER_TEMP/profile-publish"

          if git ls-remote --exit-code --refs origin refs/heads/output >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin refs/heads/output:refs/remotes/origin/output
            git worktree add --detach "$PUBLISH_DIR" origin/output
            OUTPUT_EXISTS=true
          else
            git worktree add --detach "$PUBLISH_DIR" HEAD
            git -C "$PUBLISH_DIR" switch --orphan contribution-constellation-output
            OUTPUT_EXISTS=false
          fi

          git -C "$PUBLISH_DIR" rm -rf --ignore-unmatch .
          cp "$GENERATED_DIR/contribution-scan.svg" "$PUBLISH_DIR/contribution-scan.svg"
          cp "$GENERATED_DIR/contribution-scan-dark.svg" "$PUBLISH_DIR/contribution-scan-dark.svg"
          git -C "$PUBLISH_DIR" add -- contribution-scan.svg contribution-scan-dark.svg

          if [[ "$OUTPUT_EXISTS" == "true" ]] && git -C "$PUBLISH_DIR" diff --cached --quiet; then
            echo "Contribution constellation is unchanged; nothing to publish."
            exit 0
          fi

          git -C "$PUBLISH_DIR" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: update contribution constellation"
          git -C "$PUBLISH_DIR" push origin HEAD:output
