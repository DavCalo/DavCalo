<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Engineering systems architecture</title>
  <desc id="desc">A compact systems architecture showing software as the connective layer between intelligent software, industrial systems, embedded engineering, and space systems. Subtle telemetry signals cycle through the four connections. Motion stops when reduced motion is requested.</desc>
  <style>
    .telemetry { animation: telemetry-cycle 8s ease-in-out infinite; }
    .telemetry.t2 { animation-delay: 2s; }
    .telemetry.t3 { animation-delay: 4s; }
    .telemetry.t4 { animation-delay: 6s; }
    .core-pulse { animation: telemetry-cycle 8s ease-in-out infinite; }
    @keyframes telemetry-cycle {
      0%, 18%, 100% { opacity: .18; }
      6%, 10% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .telemetry, .core-pulse { animation: none; opacity: .55; }
    }
  </style>
  <g aria-hidden="true">
