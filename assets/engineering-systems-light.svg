      <circle class="telemetry t2" cx="399" cy="99" r="4" opacity=".18"/>
      <circle class="telemetry t3" cx="321" cy="191" r="4" opacity=".18"/>
      <circle class="telemetry t4" cx="399" cy="191" r="4" opacity=".18"/>
    </g>

