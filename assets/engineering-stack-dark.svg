              <rect x="58" y="124" width="224" height="34" rx="17" fill="#092B3A" stroke="#17637A" stroke-width="1.2"/><text x="170.0" y="146" text-anchor="middle" class="chip">C</text><rect x="320" y="124" width="224" height="34" rx="17" fill="#092B3A" stroke="#17637A" stroke-width="1.2"/><text x="432.0" y="146" text-anchor="middle" class="chip">C++</text><rect x="58" y="172" width="224" height="34" rx="17" fill="#092B3A" stroke="#17637A" stroke-width="1.2"/><text x="170.0" y="194" text-anchor="middle" class="chip">CMake</text><rect x="320" y="172" width="224" height="34" rx="17" fill="#092B3A" stroke="#17637A" stroke-width="1.2"/><text x="432.0" y="194" text-anchor="middle" class="chip">Binary protocols</text>
            </g>
            
            <g>
