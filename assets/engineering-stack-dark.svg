              <rect x="615" y="47" width="550" height="7" rx="3.5"
                    fill="#3B82F6" opacity=".78"/>
              <circle class="pulse" cx="642" cy="84" r="6"
                      fill="#3B82F6"/>
              <text x="660" y="90" class="group-title">SOFTWARE</text>
              <text x="1134" y="89" text-anchor="end"
                    class="group-index">02</text>
              <rect x="638" y="124" width="224" height="34" rx="17" fill="#102857" stroke="#285EAE" stroke-width="1.2"/><text x="750.0" y="146" text-anchor="middle" class="chip">Python</text><rect x="900" y="124" width="224" height="34" rx="17" fill="#102857" stroke="#285EAE" stroke-width="1.2"/><text x="1012.0" y="146" text-anchor="middle" class="chip">Java</text><rect x="638" y="172" width="224" height="34" rx="17" fill="#102857" stroke="#285EAE" stroke-width="1.2"/><text x="750.0" y="194" text-anchor="middle" class="chip">Testing</text><rect x="900" y="172" width="224" height="34" rx="17" fill="#102857" stroke="#285EAE" stroke-width="1.2"/><text x="1012.0" y="194" text-anchor="middle" class="chip">Packaging</text>
            </g>
            
            <g>
              <rect x="34" y="256" width="552" height="180" rx="23"
                    fill="#0D1531" stroke="#8B5CF6" stroke-width="1.8"/>
              <rect x="35" y="257" width="550" height="7" rx="3.5"
                    fill="#8B5CF6" opacity=".78"/>
              <circle class="pulse" cx="62" cy="294" r="6"
                      fill="#8B5CF6"/>
              <text x="80" y="300" class="group-title">AUTOMATION</text>
              <text x="554" y="299" text-anchor="end"
