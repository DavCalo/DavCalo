              <rect x="58" y="334" width="224" height="34" rx="17" fill="#27194D" stroke="#6443B3" stroke-width="1.2"/><text x="170.0" y="356" text-anchor="middle" class="chip">Industrial robotics</text><rect x="320" y="334" width="224" height="34" rx="17" fill="#27194D" stroke="#6443B3" stroke-width="1.2"/><text x="432.0" y="356" text-anchor="middle" class="chip">Git</text><rect x="58" y="382" width="224" height="34" rx="17" fill="#27194D" stroke="#6443B3" stroke-width="1.2"/><text x="170.0" y="404" text-anchor="middle" class="chip">Terraform</text>
            </g>
            
            <g>
              <rect x="614" y="256" width="552" height="180" rx="23"
                    fill="#0D1531" stroke="#EC4899" stroke-width="1.8"/>
              <rect x="615" y="257" width="550" height="7" rx="3.5"
                    fill="#EC4899" opacity=".78"/>
              <circle class="pulse" cx="642" cy="294" r="6"
                      fill="#EC4899"/>
              <text x="660" y="300" class="group-title">RELIABILITY</text>
              <text x="1134" y="299" text-anchor="end"
                    class="group-index">04</text>
              <rect x="638" y="334" width="224" height="34" rx="17" fill="#43172F" stroke="#A93470" stroke-width="1.2"/><text x="750.0" y="356" text-anchor="middle" class="chip">GitHub Actions</text><rect x="900" y="334" width="224" height="34" rx="17" fill="#43172F" stroke="#A93470" stroke-width="1.2"/><text x="1012.0" y="356" text-anchor="middle" class="chip">Datadog</text><rect x="638" y="382" width="224" height="34" rx="17" fill="#43172F" stroke="#A93470" stroke-width="1.2"/><text x="750.0" y="404" text-anchor="middle" class="chip">Networking</text>
            </g>
            
</svg>