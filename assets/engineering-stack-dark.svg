<svg xmlns="http://www.w3.org/2000/svg"
 width="1200" height="482" viewBox="0 0 1200 482"
 role="img" aria-labelledby="title desc">
<title id="title">Davide Calò engineering stack</title>
<desc id="desc">A responsive two-by-two engineering stack grouped into systems, software, automation, and reliability. Each group uses its own coherent color.</desc>
<defs>
  <linearGradient id="stack-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/>
    <stop offset="1" stop-color="#0B1028"/>
  </linearGradient>
  <radialGradient id="stack-glow-a">
    <stop offset="0" stop-color="#22D3EE" stop-opacity=".12"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="stack-glow-b">
    <stop offset="0" stop-color="#EC4899" stop-opacity=".10"/>
    <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
text{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif
}
.group-title{
  font-size:15px;
  font-weight:850;
  letter-spacing:1.8px;
  fill:#F8FAFC
}
.group-index{
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
  fill:#8190B1
}
.chip{
  font-size:12.7px;
  font-weight:690;
  fill:#B4C0D9
}
.pulse{animation:stack-pulse 2.7s ease-in-out infinite alternate}
.twinkle{animation:stack-twinkle 4.3s ease-in-out infinite alternate}
@keyframes stack-pulse{
  from{opacity:.42}
  to{opacity:1;filter:drop-shadow(0 0 7px currentColor)}
}
@keyframes stack-twinkle{from{opacity:.12}to{opacity:.62}}
@media(prefers-reduced-motion:reduce){
  .pulse,.twinkle{animation:none!important}
}
</style>
<rect x="1" y="1" width="1198" height="480" rx="27"
      fill="url(#stack-bg)" stroke="#33466F" stroke-width="2"/>
<circle cx="160" cy="470" r="210" fill="url(#stack-glow-a)"/>
<circle cx="1110" cy="20" r="220" fill="url(#stack-glow-b)"/>
<g><circle class="twinkle" cx="73" cy="35" r="1.0" fill="#22D3EE" opacity=".28" style="animation-delay:-0.40s"/><circle class="twinkle" cx="265" cy="212" r="1.3" fill="#A78BFA" opacity=".28" style="animation-delay:-0.77s"/><circle class="twinkle" cx="516" cy="30" r="0.8" fill="#60A5FA" opacity=".28" style="animation-delay:-1.14s"/><circle class="twinkle" cx="802" cy="227" r="1.1" fill="#EC4899" opacity=".28" style="animation-delay:-1.51s"/><circle class="twinkle" cx="1098" cy="54" r="1.4" fill="#A78BFA" opacity=".28" style="animation-delay:-1.88s"/><circle class="twinkle" cx="1160" cy="338" r="0.9" fill="#22D3EE" opacity=".28" style="animation-delay:-2.25s"/><circle class="twinkle" cx="428" cy="432" r="1.2" fill="#EC4899" opacity=".28" style="animation-delay:-2.62s"/><circle class="twinkle" cx="45" cy="412" r="0.7" fill="#60A5FA" opacity=".28" style="animation-delay:-2.99s"/><circle class="twinkle" cx="900" cy="32" r="0.8" fill="#22D3EE" opacity=".28" style="animation-delay:-3.36s"/><circle class="twinkle" cx="673" cy="255" r="0.9" fill="#A78BFA" opacity=".28" style="animation-delay:-3.73s"/><circle class="twinkle" cx="337" cy="250" r="0.7" fill="#60A5FA" opacity=".28" style="animation-delay:-4.10s"/><circle class="twinkle" cx="1114" cy="252" r="1.0" fill="#EC4899" opacity=".28" style="animation-delay:-4.47s"/></g>

            <g>
