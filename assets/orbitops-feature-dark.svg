A" opacity="0.43" style="animation-duration:3.75s;animation-delay:-4.03s"/><circle class="twinkle" cx="521.8" cy="352.4" r="0.70" fill="#22D3EE" opacity="0.12" style="animation-duration:6.24s;animation-delay:-5.98s"/><circle class="twinkle" cx="780.7" cy="233.7" r="0.55" fill="#E2E8F0" opacity="0.19" style="animation-duration:6.25s;animation-delay:-1.65s"/><circle class="twinkle" cx="630.3" cy="143.6" r="1.15" fill="#E2E8F0" opacity="0.20" style="animation-duration:5.08s;animation-delay:-6.39s"/><circle class="twinkle" cx="1051.2" cy="316.2" r="0.55" fill="#22D3EE" opacity="0.34" style="animation-duration:3.46s;animation-delay:-3.26s"/><circle class="twinkle" cx="1037.1" cy="21.2" r="0.70" fill="#A78BFA" opacity="0.30" style="animation-duration:6.24s;animation-delay:-3.05s"/><circle class="twinkle" cx="794.8" cy="182.0" r="0.55" fill="#EC4899" opacity="0.35" style="animation-duration:5.05s;animation-delay:-4.79s"/><circle class="twinkle" cx="741.3" cy="65.6" r="0.55" fill="#60A5FA" opacity="0.40" style="animation-duration:4.89s;animation-delay:-5.53s"/><circle class="twinkle" cx="600.9" cy="69.1" r="1.45" fill="#A78BFA" opacity="0.54" style="animation-duration:3.61s;animation-delay:-3.58s"/><circle class="twinkle" cx="650.8" cy="195.5" r="0.90" fill="#E2E8F0" opacity="0.21" style="animation-duration:5.30s;animation-delay:-1.89s"/><circle class="twinkle" cx="995.5" cy="140.2" r="0.70" fill="#A78BFA" opacity="0.40" style="animation-duration:4.94s;animation-delay:-0.05s"/><circle class="twinkle" cx="730.2" cy="80.6" r="0.55" fill="#EC4899" opacity="0.21" style="animation-duration:4.91s;animation-delay:-3.68s"/><circle class="twinkle" cx="541.3" cy="188.7" r="1.15" fill="#EC4899" opacity="0.24" style="animation-duration:6.98s;animation-delay:-0.89s"/><circle class="twinkle" cx="640.2" cy="113.4" r="0.70" fill="#A78BFA" opacity="0.20" style="animation-duration:6.66s;animation-delay:-4.34s"/><circle class="twinkle" cx="457.6" cy="291.7" r="0.55" fill="#60A5FA" opacity="0.16" style="animation-duration:3.75s;animation-delay:-6.34s"/><circle class="twinkle" cx="507.8" cy="267.6" r="0.70" fill="#A78BFA" opacity="0.14" style="animation-duration:5.40s;animation-delay:-3.25s"/></g><text x="54" y="52" class="eyebrow">FEATURED SYSTEM</text><text x="54" y="112" class="brand">OrbitOps</text><text x="56" y="149" class="headline">Deterministic CubeSat telemetry, end to end.</text><text x="56" y="188" class="body">Binary packet generation and reproducible link faults,</text><text x="56" y="213" class="body">strict validation, recording, replay, alarm lifecycles,</text><text x="56" y="238" class="body">and deterministic session inspection.</text><g transform="translate(54 272)"><rect width="122" height="30" rx="15" fill="#121D42" stroke="#2B3C68"/><text x="61" y="20" text-anchor="middle" class="chip-text">DETERMINISTIC</text><rect x="132" width="102" height="30" rx="15" fill="#121D42" stroke="#2B3C68"/><text x="183" y="20" text-anchor="middle" class="chip-text">VERSIONED</text><rect x="244" width="100" height="30" rx="15" fill="#121D42" stroke="#2B3C68"/><text x="294" y="20" text-anchor="middle" class="chip-text">AUDITABLE</text></g><text x="56" y="344" class="meta">C++17 · Python · UDP · CMake · TOML · GitHub Actions</text><g class="module"><rect x="500" y="105" width="180" height="122" rx="20" fill="#111A3A" stroke="#22D3EE" stroke-width="1.8"/><circle cx="528" cy="134" r="13" fill="#22D3EE" opacity=".16"/><text x="528" y="139" text-anchor="middle" class="step">01</text><text x="590" y="174" text-anchor="middle" class="module-title">C++ ON-BOARD</text><text x="590" y="201" text-anchor="middle" class="module-sub">35-byte binary packets</text></g><g class="module"><rect x="735" y="105" width="180" height="122" rx="20" fill="#111A3A" stroke="#3B82F6" stroke-width="1.8"/><circle cx="763" cy="134" r="13" fill="#3B82F6" opacity=".16"/><text x="763" y="139" text-anchor="middle" class="step">02</text><text x="825" y="174" text-anchor="middle" class="module-title">IMPAIRED LINK</text><text x="825" y="201" text-anchor="middle" class="module-sub">loss · latency · jitter</text></g><g class="module"><rect x="970" y="105" width="180" height="122" rx="20" fill="#111A3A" stroke="#8B5CF6" stroke-width="1.8"/><circle cx="998" cy="134" r="13" fill="#8B5CF6" opacity=".16"/><text x="998" y="139" text-anchor="middle" class="step">03</text><text x="1060" y="174" text-anchor="middle" class="module-title">GROUND STATION</text><text x="1060" y="201" text-anchor="middle" class="module-sub">validate · record · replay</text></g><path class="flow" d="M680 166H735M915 166H970" fill="none" stroke="url(#oo-flow)" stroke-width="3"/><circle class="packet-a" cx="687" cy="166" r="5" fill="#22D3EE" filter="url(#oo-glow)"/><circle class="packet-b" cx="922" cy="166" r="5" fill="#3B82F6" filter="url(#oo-glow)"/><path d="M1060 227V263H825" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="5 7" opacity=".76"/><circle class="packet-c" cx="1060" cy="231" r="4.5" fill="#EC4899" filter="url(#oo-glow)"/><rect x="735" y="263" width="415" height="78" rx="19" fill="#0D1531" stroke="#EC4899" stroke-width="1.7"/><circle class="alarm-pulse" cx="770" cy="302" r="9" fill="#EC4899"/><text x="795" y="296" class="alarm-title">AUDITABLE ALARM LIFECYCLE</text><text x="795" y="320" class="alarm-sub">raised · updated · cleared · correlated by packet sequence</text></svg>