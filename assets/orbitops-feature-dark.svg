8.6" cy="136.8" r="0.6" fill="#8B5CF6" opacity="0.42" style="animation-delay:-3.57s;animation-duration:6.63s"/><circle class="twinkle" cx="462.1" cy="188.4" r="0.6" fill="#22D3EE" opacity="0.30" style="animation-delay:-3.68s;animation-duration:5.60s"/><circle class="twinkle" cx="1071.6" cy="20.8" r="1" fill="#A7B4D0" opacity="0.42" style="animation-delay:-4.69s;animation-duration:5.22s"/><circle class="twinkle" cx="844.2" cy="366.7" r="0.6" fill="#EC4899" opacity="0.19" style="animation-delay:-1.19s;animation-duration:6.66s"/><circle class="twinkle" cx="516.2" cy="35.6" r="1.4" fill="#22D3EE" opacity="0.45" style="animation-delay:-0.90s;animation-duration:5.90s"/><circle class="twinkle" cx="488.8" cy="67.0" r="1" fill="#22D3EE" opacity="0.48" style="animation-delay:-3.74s;animation-duration:5.62s"/><circle class="twinkle" cx="704.7" cy="113.9" r="0.6" fill="#8B5CF6" opacity="0.48" style="animation-delay:-2.36s;animation-duration:6.34s"/><circle class="twinkle" cx="774.8" cy="51.0" r="1" fill="#A7B4D0" opacity="0.38" style="animation-delay:-2.37s;animation-duration:4.73s"/><circle class="twinkle" cx="363.3" cy="330.2" r="0.8" fill="#3B82F6" opacity="0.45" style="animation-delay:-4.03s;animation-duration:6.34s"/><circle class="twinkle" cx="798.7" cy="262.1" r="0.8" fill="#EC4899" opacity="0.13" style="animation-delay:-4.96s;animation-duration:3.15s"/><circle class="twinkle" cx="426.4" cy="393.9" r="0.8" fill="#3B82F6" opacity="0.15" style="animation-delay:-2.52s;animation-duration:5.07s"/><circle class="twinkle" cx="707.5" cy="209.9" r="1" fill="#EC4899" opacity="0.38" style="animation-delay:-0.46s;animation-duration:4.20s"/><circle class="twinkle" cx="481.5" cy="317.7" r="1.4" fill="#A7B4D0" opacity="0.14" style="animation-delay:-3.74s;animation-duration:4.58s"/><circle class="twinkle" cx="249.5" cy="250.0" r="0.8" fill="#22D3EE" opacity="0.43" style="animation-delay:-0.53s;animation-duration:6.34s"/></g>
<text x="54" y="58" class="k">FEATURED SYSTEM</text><text x="54" y="123" class="brand">OrbitOps</text>
<text x="56" y="162" class="h">Deterministic CubeSat telemetry, end to end.</text>
<text x="56" y="204" class="body">Binary packet generation, reproducible link faults,</text><text x="56" y="230" class="body">strict validation, alarm lifecycles, recording, replay,</text><text x="56" y="256" class="body">and deterministic session inspection.</text>
<g transform="translate(54 286)"><rect width="132" height="32" rx="16" fill="#121D42" stroke="#2B3C68"/><text x="66" y="21" text-anchor="middle" class="pill">DETERMINISTIC</text><rect x="143" width="112" height="32" rx="16" fill="#121D42" stroke="#2B3C68"/><text x="199" y="21" text-anchor="middle" class="pill">VERSIONED</text><rect x="266" width="110" height="32" rx="16" fill="#121D42" stroke="#2B3C68"/><text x="321" y="21" text-anchor="middle" class="pill">AUDITABLE</text></g>
<text x="56" y="365" class="bs">C++17 · Python · UDP · CMake · TOML · GitHub Actions</text>
<!-- architecture -->
<g>
 <rect x="505" y="110" width="178" height="122" rx="19" fill="#111A3A" stroke="#22D3EE" stroke-width="1.8"/><circle cx="540" cy="149" r="16" fill="#22D3EE" opacity=".18"/><path d="M532 149H548M540 141V157" stroke="#22D3EE" stroke-width="2"/><text x="532" y="192" class="bt">C++ SIMULATOR</text><text x="532" y="214" class="bs">35-byte telemetry packets</text>
 <rect x="757" y="110" width="178" height="122" rx="19" fill="#111A3A" stroke="#3B82F6" stroke-width="1.8"/><circle cx="792" cy="149" r="16" fill="#3B82F6" opacity=".18"/><path d="M784 149H800M792 141V157" stroke="#3B82F6" stroke-width="2"/><text x="784" y="192" class="bt">IMPAIRED LINK</text><text x="784" y="214" class="bs">loss · latency · jitter · faults</text>
 <rect x="1009" y="110" width="158" height="122" rx="19" fill="#111A3A" stroke="#8B5CF6" stroke-width="1.8"/><circle cx="1043" cy="149" r="16" fill="#8B5CF6" opacity=".18"/><path d="M1035 149H1051M1043 141V157" stroke="#8B5CF6" stroke-width="2"/><text x="1037" y="192" class="bt">GROUND STATION</text><text x="1037" y="214" class="bs">validate · record · replay</text>
 <path class="flow" d="M683 171H757M935 171H1009" fill="none" stroke="url(#flow)" stroke-width="3"/>
