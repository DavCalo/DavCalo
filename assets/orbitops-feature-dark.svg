<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">OrbitOps — deterministic CubeSat telemetry platform</title><desc id="desc">Animated architecture diagram showing a C++ on-board simulator, an impaired deterministic link, a Python ground station, and an auditable alarm lifecycle. All labels remain inside their modules.</desc><defs><linearGradient id="oo-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0B1028"/></linearGradient><linearGradient id="oo-flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".52" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><radialGradient id="oo-nebula"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".22"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><filter id="oo-glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2.7px;fill:#22D3EE}.brand{font-size:50px;font-weight:820;letter-spacing:-1.6px;fill:#F8FAFC}.headline{font-size:19px;font-weight:650;fill:#A7B4D0}.body{font-size:14.5px;font-weight:470;fill:#A7B4D0}.meta{font-size:11.8px;font-weight:600;fill:#7482A5}.chip-text{font-size:11.3px;font-weight:760;fill:#F8FAFC}.step{font-size:10px;font-weight:850;fill:#F8FAFC}.module-title{font-size:13.2px;font-weight:820;letter-spacing:.3px;fill:#F8FAFC}.module-sub{font-size:11.2px;font-weight:580;fill:#A7B4D0}.alarm-title{font-size:13.5px;font-weight:820;fill:#F8FAFC}.alarm-sub{font-size:11.4px;font-weight:570;fill:#A7B4D0}.flow{stroke-dasharray:7 10;animation:oo-flow 7s linear infinite}.packet-a{animation:oo-a 5.4s cubic-bezier(.4,0,.2,1) infinite}.packet-b{animation:oo-b 5.4s cubic-bezier(.4,0,.2,1) infinite 1.55s}.packet-c{animation:oo-c 5.4s cubic-bezier(.4,0,.2,1) infinite .7s}.alarm-pulse{animation:oo-pulse 2.8s ease-in-out infinite alternate}.twinkle{animation:oo-twinkle 4s ease-in-out infinite alternate}@keyframes oo-flow{to{stroke-dashoffset:-260}}@keyframes oo-a{0%,8%{transform:translateX(0);opacity:0}15%{opacity:1}47%{transform:translateX(55px);opacity:1}55%,100%{transform:translateX(55px);opacity:0}}@keyframes oo-b{0%,8%{transform:translateX(0);opacity:0}15%{opacity:1}47%{transform:translateX(55px);opacity:1}55%,100%{transform:translateX(55px);opacity:0}}@keyframes oo-c{0%,8%{transform:translateY(0);opacity:0}15%{opacity:1}48%{transform:translateY(35px);opacity:1}58%,100%{transform:translateY(35px);opacity:0}}@keyframes oo-pulse{from{opacity:.42}to{opacity:1;filter:drop-shadow(0 0 8px #EC4899)}}@keyframes oo-twinkle{from{opacity:.1}to{opacity:.65}}@media(prefers-reduced-motion:reduce){.flow,.packet-a,.packet-b,.packet-c,.alarm-pulse,.twinkle{animation:none!important}.packet-a,.packet-b{transform:translateX(28px);opacity:1}.packet-c{transform:translateY(18px);opacity:1}}</style><rect x="1" y="1" width="1198" height="398" rx="28" fill="url(#oo-bg)" stroke="#33466F" stroke-width="2"/><circle cx="1030" cy="30" r="250" fill="url(#oo-nebula)"/><g><circle class="twinkle" cx="402.9" cy="288.4" r="1.15" fill="#A78BFA" opacity="0.45" style="animation-duration:4.31s;animation-delay:-4.13s"/><circle class="twinkle" cx="621.9" cy="251.6" r="1.15" fill="#60A5FA" opacity="0.25" style="animation-duration:6.16s;animation-delay:-6.64s"/><circle class="twinkle" cx="1145.2" cy="165.1" r="0.70" fill="#A78BFA" opacity="0.16" style="animation-duration:3.73s;animation-delay:-5.33s"/><circle class="twinkle" cx="1150.5" cy="325.3" r="1.15" fill="#22D3EE" opacity="0.12" style="animation-duration:5.31s;animation-delay:-0.67s"/><circle class="twinkle" cx="742.3" cy="255.8" r="0.90" 