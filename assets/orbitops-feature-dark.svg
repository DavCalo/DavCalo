<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">OrbitOps — deterministic CubeSat telemetry platform</title>
<desc id="desc">Animated diagram showing a C++ on-board simulator, deterministic impaired link, Python ground station, and auditable alarm lifecycle.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0B1028"/></linearGradient>
 <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.k{font-size:13px;font-weight:760;letter-spacing:2.7px;fill:#22D3EE}.brand{font-size:52px;font-weight:800;letter-spacing:-1.7px;fill:#F8FAFC}.h{font-size:20px;font-weight:650;fill:#A7B4D0}.body{font-size:15px;font-weight:450;fill:#A7B4D0}.bt{font-size:15px;font-weight:780;fill:#F8FAFC}.bs{font-size:12px;font-weight:560;fill:#A7B4D0}.pill{font-size:12px;font-weight:720;fill:#F8FAFC;}.flow{stroke-dasharray:7 10;animation:flow 8s linear infinite}.packet1{animation:p1 4.8s cubic-bezier(.4,0,.2,1) infinite}.packet2{animation:p2 4.8s cubic-bezier(.4,0,.2,1) infinite 1.3s}.alarm{animation:alarm 3.4s ease-in-out infinite alternate}.twinkle{animation:twinkle 4s ease-in-out infinite alternate}@keyframes flow{to{stroke-dashoffset:-300}}@keyframes p1{0%,8%{transform:translateX(0);opacity:0}15%{opacity:1}48%{transform:translateX(72px);opacity:1}55%,100%{transform:translateX(72px);opacity:0}}@keyframes p2{0%,8%{transform:translateX(0);opacity:0}15%{opacity:1}48%{transform:translateX(72px);opacity:1}55%,100%{transform:translateX(72px);opacity:0}}@keyframes alarm{from{opacity:.4}to{opacity:1;filter:drop-shadow(0 0 7px #EC4899)}}@keyframes twinkle{from{opacity:.12}to{opacity:.65}}@media(prefers-reduced-motion:reduce){.flow,.packet1,.packet2,.alarm,.twinkle{animation:none!important}.packet1{transform:translateX(36px);opacity:1}.packet2{opacity:0}}
</style>
<rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#bg)" stroke="#33466F" stroke-width="2"/>
