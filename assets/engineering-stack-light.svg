<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc"><title id="title">Davide Calò engineering stack</title><desc id="desc">Four coherent engineering groups: systems, software, automation, and reliability.</desc><defs><linearGradient id="stack-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFF"/><stop offset="1" stop-color="#E9F1FF"/></linearGradient></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.group-title{font-size:13px;font-weight:850;letter-spacing:1.4px;fill:#0F172A}.chip{font-size:11.3px;font-weight:650;fill:#52617A}.node{animation:stack-pulse 2.8s ease-in-out infinite alternate}.twinkle{animation:stack-twinkle 4s ease-in-out infinite alternate}@keyframes stack-pulse{from{opacity:.38}to{opacity:1;filter:drop-shadow(0 0 6px currentColor)}}@keyframes stack-twinkle{from{opacity:.1}to{opacity:.55}}@media(prefers-reduced-motion:reduce){.node,.twinkle{animation:none!important}}</style><rect x="1" y="1" width="1198" height="268" rx="26" fill="url(#stack-bg)" stroke="#B8C8E4" stroke-width="2"/><g><circle class="twinkle" cx="181.1" cy="143.4" r="0.90" fill="#0891B2" opacity="0.35" style="animation-duration:5.25s;animation-delay:-4.31s"/><circle class="twinkle" cx="1015.2" cy="31.8" r="0.90" fill="#7C3AED" opacity="0.43" style="animation-duration:6.86s;animation-delay:-0.02s"/><circle class="twinkle" cx="330.5" cy="128.9" r="0.70" fill="#7C3AED" opacity="0.43" style="animation-duration:5.06s;animation-delay:-6.72s"/><circle class="twinkle" cx="515.3" cy="49.4" r="0.70" fill="#0891B2" opacity="0.49" style="animation-duration:6.16s;animation-delay:-3.62s"/><circle class="twinkle" cx="881.4" cy="208.5" r="0.55" fill="#0891B2" opacity="0.25" style="animation-duration:6.98s;animation-delay:-5.09s"/><circle class="twinkle" cx="719.9" cy="123.4" r="1.15" fill="#0891B2" opacity="0.48" style="animation-duration:3.70s