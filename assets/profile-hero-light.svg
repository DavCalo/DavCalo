<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Davide Calò — systems and embedded software engineering</title>
  <desc id="desc">Animated technical profile banner with a CubeSat crossing an orbital path and a signal travelling from intelligent software through automation and embedded systems to orbit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DB2777"/><stop offset=".36" stop-color="#EA580C"/><stop offset=".68" stop-color="#0891B2"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow-a"><stop offset="0" stop-color="#7C3AED" stop-opacity=".32"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-b"><stop offset="0" stop-color="#0891B2" stop-opacity=".24"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size:58px;font-weight:760;letter-spacing:-1.8px;fill:#0F172A; }
    .eyebrow { font-size:14px;font-weight:700;letter-spacing:3.2px;fill:#0891B2; }
    .subtitle { font-size:23px;font-weight:560;fill:#52627A; }
    .tagline { font-size:17px;font-weight:450;fill:#52627A; }
    .pill-text { font-size:13px;font-weight:650;fill:#0F172A; }
    .node-label { font-size:12px;font-weight:700;letter-spacing:1.4px; }
    .twinkle { animation: twinkle 4s ease-in-out infinite alternate; }
    .satellite { transform:translate(930px,108px) rotate(-6deg); animation:satellite-pass 18s cubic-bezier(.42,.02,.3,1) infinite; }
    .signal-dot { animation:signal-pulse 8s cubic-bezier(.4,0,.2,1) infinite; }
    .signal-line { stroke-dasharray:8 12; animation:dash 12s linear infinite; }
    .node-pulse { animation:node-pulse 3s ease-in-out infinite alternate; }
    @keyframes satellite-pass {
      0%,8% { transform:translate(850px,84px) rotate(-10deg); opacity:0; }
      13% { opacity:1; }
      34% { transform:translate(1010px,74px) rotate(4deg); opacity:1; }
      53% { transform:translate(1080px,160px) rotate(17deg); opacity:1; }
      62%,100% { transform:translate(1130px,225px) rotate(24deg); opacity:0; }
    }
    @keyframes signal-pulse {
      0%,8% { transform:translateX(0);opacity:0; } 12% { opacity:1; }
      82% { transform:translateX(660px);opacity:1; } 90%,100% { transform:translateX(660px);opacity:0; }
    }
    @keyframes twinkle { from { opacity:.18; } to { opacity:.86; } }
    @keyframes dash { to { stroke-dashoffset:-400; } }
    @keyframes node-pulse { from { opacity:.35; } to { opacity:1;filter:drop-shadow(0 0 5px currentColor); } }
    @media (prefers-reduced-motion: reduce) {
      .twinkle,.satellite,.signal-dot,.signal-line,.node-pulse { animation:none!important; }
      .satellite { transform:translate(1015px,98px) rotate(5deg);opacity:1; }
      .signal-dot { transform:translateX(430px);opacity:1; }
    }
  </style>
