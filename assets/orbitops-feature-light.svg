 <path d="M1088 232V280H918" fill="none" stroke="#DB2777" stroke-width="2" stroke-dasharray="5 7" opacity=".75"/>
 <rect x="820" y="270" width="230" height="82" rx="18" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.7"/><circle class="alarm" cx="854" cy="311" r="9" fill="#DB2777"/><text x="878" y="305" class="bt">AUDITABLE ALARMS</text><text x="878" y="329" class="bs">raised · updated · cleared</text>
</g>
</svg>