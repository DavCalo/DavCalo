<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">OrbitOps — deterministic CubeSat telemetry platform</title><desc id="desc">Animated architecture diagram showing a C++ on-board simulator, an impaired deterministic link, a Python ground station, and an auditable alarm lifecycle. All labels remain inside their modules.</desc><defs><linearGradient id="oo-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFF"/><stop offset="1" stop-color="#E9F1FF"/></linearGradient><linearGradient id="oo-flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset=".52" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><radialGradient id="oo-nebula"><stop offset="0" stop-color="#7C3AED" stop-opacity=".22"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient><filter id="oo-glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2.7px;fill:#0891B2}.brand{font-size:50px;font-weight:820;letter-spacing:-1.6px;fill:#0F172A}.headline{font-size:19px;font-weight:650;fill:#475569}.body{font-size:14.5px;font-weight:470;fill:#475569}.meta{font-size:11.8px;font-weight:600;fill:#64748B}.chip-text{font-size:11.3px;font-weight:760;fill:#0F172A}.step{font-size:10px;font-weight:850;fill:#0F172A}.module-title{font-size:13.2px;font-weight:820;letter-spacing:.3px;fill:#0F172A}.module-sub{font-size:11.2px;font-weight:580;fill:#475569}.alarm-title{font-size:13.5px;font-weight:820;fill:#0F172A}.alarm-sub{font-size:11.4px;font-weight:570;fill:#475569}.flow{stroke-dasharray:7 10;animation:oo-flow 7s linear infinite}.packet-a{animation:oo-a 5.4s cubic-bezier(.4,0,.2,1) infinite}.packet-b{animation:oo-b 5.4s cubic-bezier(.4,0,.2,1) infinite 1.55s}.packet-c{animation:oo-c 5.4s cubic-bezier(.4,0,.2,1) infinite .7s}.alarm-pulse{animation:oo-pulse 2.8s ease-in-out infinite alternate}.twinkle{animation:oo-twinkle 4s ease-in-out infinite alternate}@keyframes oo-flow{to{stroke-dashoffset:-260}}@keyframes oo-a{0%,8%{transform:translateX(0);opacity:0}15%{opacity:1}47%{transform:translateX(55px);opacity:1}55%,100%{transform:translateX(55px);opacity:0}}@keyframes oo-b{0%,8%{transform:translateX(0);opacity:0}15%{opacity:1}47%{transform:translateX(55px);opacity:1}55%,100%{transform:translateX(55px);opacity:0}}@keyframes oo-c{0%,8%{transform:translateY(0);opacity:0}15%{opacity:1}48%{transform:translateY(35px);opacity:1}58%,100%{transform:translateY(35px);opacity:0}}@keyframes oo-pulse{from{opacity:.42}to{opacity:1;filter:drop-shadow(0 0 8px #DB2777)}}@keyframes oo-twinkle{from{opacity:.1}to{opacity:.65}}@media(prefers-reduced-motion:reduce){.flow,.packet-a,.packet-b,.packet-c,.alarm-pulse,.twinkle{animation:none!important}.packet-a,.packet-b{transform:translateX(28px);opacity:1}.packet-c{transform:translateY(18px);opacity:1}}</style><rect x="1" y="1" width="1198" height="398" rx="28" fill="url(#oo-bg)" stroke="#B8C8E4" stroke-width="2"/><circle cx="1030" cy="30" r="250" fill="url(#oo-nebula)"/><g><circle class="twinkle" cx="733.5" cy="200.9" r="0.55" fill="#64748B" opacity="0.31" style="animation-duration:4.40s;animation-delay:-0.80s"/><circle class="twinkle" cx="1139.7" cy="105.4" r="1.45" fill="#7C3AED" opacity="0.31" style="animation-duration:5.79s;animation-delay:-1.36s"/><circle class="twinkle" cx="483.1" cy="224.0" r="1.15" fill="#DB2777" opacity="0.30" style="animation-duration:6.99s;animation-delay:-5.08s"/><circle class="twinkle" cx="566.0" cy="140.1" r="0.70" fill="#2563EB" opacity="0.34" style="animation-duration:7.16s;animation-delay:-5.54s"/><circle class="twinkle" cx="391.7" cy="319.8" r="0.70" fill="#7C3AED" opacity="0.24" style="animation-duration:6.66s;animation-delay:-6.32s"/><circle class="twinkle" cx="567.6" cy="24.5" r="0.90" fill="#DB2777" opacity="0.12" style="animation-duration:3.93s;animation-delay:-6.09s"/><circle class="twinkle" cx="1084.6" cy="159.6" r="1.45" fill="#7C3AED" opacity="0.42" style="animation-duration:3.87s;animation-delay:-5.03s"/><circle class="twinkle" cx="771.1" cy="305.6" r="1.15" fill="#7C3AED" opacity="0.44" style="animation-duration:6.91s;animation-delay:-4.54s"/><circle class="twinkle" cx="482.9" cy="241.2" r="1.15" fill="#DB2777" opacity="0.50" style="animation-duration:6.92s;animation-delay:-2.49s"/><circle class="twinkle" cx="397.4" cy="340.9" r="0.55" fill="#2563EB" opacity="0.23" style="animation-duration:6.25s;animation-delay:-1.39s"/><circle class="twinkle" cx="1021.2" cy="172.7" r="1.15" fill="#2563EB" opacity="0.41" style="animation-duration:5.95s;animation-delay:-6.81s"/><circle class="twinkle" cx="986.8" cy="99.6" r="0.90" fill="#0891B2" opacity="0.16" style="animation-duration:3.73s;animation-delay:-6.52s"/><circle class="twinkle" cx="1050.9" cy="151.2" r="1.15" fill="#2563EB" opacity="0.30" style="animation-duration:3.67s;animation-delay:-0.95s"/><circle class="twinkle" cx="1163.8" cy="300.3" r="0.90" fill="#2563EB" opacity="0.16" style="animation-duration:5.81s;animation-delay:-0.58s"/><circle class="twinkle" cx="817.9" cy="96.5" r="0.90" fill="#0891B2" opacity="0.48" style="animation-duration:6.81s;animation-delay:-1.71s"/><circle class="twinkle" cx="592.5" cy="352.9" r="0.90" fill="#0891B2" opacity="0.42" style="animation-duration:5.35s;animation-delay:-0.10s"/><circle class="twinkle" cx="739.4" cy="93.9" r="1.15" fill="#64748B" opacity="0.23" style="animation-duration:3.96s;animation-delay:-4.17s"/><circle class="twinkle" cx="1020.6" cy="320.0" r="1.45" fill="#64748B" opacity="0.47" style="animation-duration:6.20s;animation-delay:-4.95s"/><circle class="twinkle" cx="1134.1" cy="34.3" r="1.45" fill="#2563EB" opacity="0.50" style="animation-duration:4.19s;animation-delay:-3.14s"/><circle class="twinkle" cx="911.2" cy="70.2" r="1.15" fill="#DB2777" opacity="0.21" style="animation-duration:7.04s;animation-delay:-1.52s"/><circle class="twinkle" cx="1082.0" cy="262.0" r="1.45" fill="#2563EB" opacity="0.39" style="animation-duration:4.46s;animation-delay:-5.17s"/><circle class="twinkle" cx="656.8" cy="300.7" r="0.55" fill="#7C3AED" opacity="0.39" style="animation-duration:7.15s;animation-delay:-2.24s"/><circle class="twinkle" cx="478.8" cy="215.2" r="0.55" fill="#64748B" opacity="0.52" style="animation-duration:5.84s;animation-delay:-0.54s"/><circle class="twinkle" cx="567.0" cy="61.0" r="0.70" fill="#64748B" opacity="0.39" style="animation-duration:6.87s;animation-delay:-2.31s"/><circle class="twinkle" cx="813.1" cy="276.6" r="0.70" fill="#DB2777" opacity="0.25" style="animation-duration:6.16s;animation-delay:-5.21s"/><circle class="twinkle" cx="824.6" cy="199.0" r="1.15" fill="#7C3AED" opacity="0.46" style="animation-duration:6.83s;animation-delay:-3.36s"/><circle class="twinkle" cx="1016.8" cy="139.0" r="1.45" fill="#0891B2" opacity="0.25" style="animation-duration:6.06s;animation-delay:-2.15s"/><circle class="twinkle" cx="697.2" cy="348.6" r="0.90" fill="#7C3AED" opacity="0.26" style="animation-duration:5.03s;animation-delay:-1.98s"/><circle class="twinkle" cx="606.8" cy="24.8" r="1.15" fill="#DB2777" opacity="0.19" style="animation-duration:6.22s;animation-delay:-4.86s"/><circle class="twinkle" cx="1078.9" cy="301.7" r="0.55" fill="#64748B" opacity="0.32" style="animation-duration:6.22s;animation-delay:-6.24s"/><circle class="twinkle" cx="737.7" cy="57.4" r="0.90" fill="#64748B" opacity="0.49" style="animation-duration:4.56s;animation-delay:-6.13s"/><circle class="twinkle" cx="1024.1" cy="246.8" r="0.70" fill="#7C3AED" opacity="0.21" style="animation-duration:4.22s;animation-delay:-2.40s"/><circle class="twinkle" cx="691.9" cy="351.4" r="0.90" fill="#DB2777" opacity="0.28" style="animation-duration:6.98s;animation-delay:-5.27s"/><circle class="twinkle" cx="498.1" cy="60.6" r="0.55" fill="#7C3AED" opacity="0.16" style="animation-duration:5.24s;animation-delay:-1.18s"/></g><text x="54" y="52" class="eyebrow">FEATURED SYSTEM</text><text x="54" y="112" class="brand">OrbitOps</text><text x="56" y="149" class="headline">Deterministic CubeSat telemetry, end to end.</text><text x="56" y="188" class="body">Binary packet generation and reproducible link faults,</text><text x="56" y="213" class="body">strict validation, recording, replay, alarm lifecycles,</text><text x="56" y="238" class="body">and deterministic session inspection.</text><g transform="translate(54 272)"><rect width="122" height="30" rx="15" fill="#EEF3FF" stroke="#C7D4ED"/><text x="61" y="20" text-anchor="middle" class="chip-text">DETERMINISTIC</text><rect x="132" width="102" height="30" rx="15" fill="#EEF3FF" stroke="#C7D4ED"/><text x="183" y="20" text-anchor="middle" class="chip-text">VERSIONED</text><rect x="244" width="100" height="30" rx="15" fill="#EEF3FF" stroke="#C7D4ED"/><text x="294" y="20" text-anchor="middle" class="chip-text">AUDITABLE</text></g><text x="56" y="344" class="meta">C++17 · Python · UDP · CMake · TOML · GitHub Actions</text><g class="module"><rect x="500" y="105" width="180" height="122" rx="20" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.8"/><circle cx="528" cy="134" r="13" fill="#0891B2" opacity=".16"/><text x="528" y="139" text-anchor="middle" class="step">01</text><text x="590" y="174" text-anchor="middle" class="module-title">C++ ON-BOARD</text><text x="590" y="201" text-anchor="middle" class="module-sub">35-byte binary packets</text></g><g class="module"><rect x="735" y="105" width="180" height="122" rx="20" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/><circle cx="763" cy="134" r="13" fill="#2563EB" opacity=".16"/><text x="763" y="139" text-anchor="middle" class="step">02</text><text x="825" y="174" text-anchor="middle" class="module-title">IMPAIRED LINK</text><text x="825" y="201" text-anchor="middle" class="module-sub">loss · latency · jitter</text></g><g class="module"><rect x="970" y="105" width="180" height="122" rx="20" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><circle cx="998" cy="134" r="13" fill="#7C3AED" opacity=".16"/><text x="998" y="139" text-anchor="middle" class="step">03</text><text x="1060" y="174" text-anchor="middle" class="module-title">GROUND STATION</text><text x="1060" y="201" text-anchor="middle" class="module-sub">validate · record · replay</text></g><path class="flow" d="M680 166H735M915 166H970" fill="none" stroke="url(#oo-flow)" stroke-width="3"/><circle class="packet-a" cx="687" cy="166" r="5" fill="#0891B2" filter="url(#oo-glow)"/><circle class="packet-b" cx="922" cy="166" r="5" fill="#2563EB" filter="url(#oo-glow)"/><path d="M1060 227V263H825" fill="none" stroke="#DB2777" stroke-width="2" stroke-dasharray="5 7" opacity=".76"/><circle class="packet-c" cx="1060" cy="231" r="4.5" fill="#DB2777" filter="url(#oo-glow)"/><rect x="735" y="263" width="415" height="78" rx="19" fill="#F5F8FF" stroke="#DB2777" stroke-width="1.7"/><circle class="alarm-pulse" cx="770" cy="302" r="9" fill="#DB2777"/><text x="795" y="296" class="alarm-title">AUDITABLE ALARM LIFECYCLE</text><text x="795" y="320" class="alarm-sub">raised · updated · cleared · correlated by packet sequence</text></svg>