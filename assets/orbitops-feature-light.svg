<text x="54" y="58" class="k">FEATURED SYSTEM</text><text x="54" y="123" class="brand">OrbitOps</text>
<text x="56" y="162" class="h">Deterministic CubeSat telemetry, end to end.</text>
<text x="56" y="204" class="body">Binary packet generation, reproducible link faults,</text><text x="56" y="230" class="body">strict validation, alarm lifecycles, recording, replay,</text><text x="56" y="256" class="body">and deterministic session inspection.</text>
<g transform="translate(54 286)"><rect width="132" height="32" rx="16" fill="#EEF4FF" stroke="#C8D7F0"/><text x="66" y="21" text-anchor="middle" class="pill">DETERMINISTIC</text><rect x="143" width="112" height="32" rx="16" fill="#EEF4FF" stroke="#C8D7F0"/><text x="199" y="21" text-anchor="middle" class="pill">VERSIONED</text><rect x="266" width="110" height="32" rx="16" fill="#EEF4FF" stroke="#C8D7F0"/><text x="321" y="21" text-anchor="middle" class="pill">AUDITABLE</text></g>
<text x="56" y="365" class="bs">C++17 · Python · UDP · CMake · TOML · GitHub Actions</text>
<!-- architecture -->
<g>
 <rect x="505" y="110" width="178" height="122" rx="19" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.8"/><circle cx="540" cy="149" r="16" fill="#0891B2" opacity=".18"/><path d="M532 149H548M540 141V157" stroke="#0891B2" stroke-width="2"/><text x="532" y="192" class="bt">C++ SIMULATOR</text><text x="532" y="214" class="bs">35-byte telemetry packets</text>
 <rect x="757" y="110" width="178" height="122" rx="19" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/><circle cx="792" cy="149" r="16" fill="#2563EB" opacity=".18"/><path d="M784 149H800M792 141V157" stroke="#2563EB" stroke-width="2"/><text x="784" y="192" class="bt">IMPAIRED LINK</text><text x="784" y="214" class="bs">loss · latency · jitter · faults</text>
 <rect x="1009" y="110" width="158" height="122" rx="19" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/><circle cx="1043" cy="149" r="16" fill="#7C3AED" opacity=".18"/><path d="M1035 149H1051M1043 141V157" stroke="#7C3AED" stroke-width="2"/><text x="1037" y="192" class="bt">GROUND STATION</text><text x="1037" y="214" class="bs">validate · record · replay</text>
 <path class="flow" d="M683 171H757M935 171H1009" fill="none" stroke="url(#flow)" stroke-width="3"/>
